#@     "  }",
#@     "  root * /data/stats",
#@     "  file_server",
#@     "  encode zstd gzip",
#@     "}"
#@   ]
#@   return "\n".join(lines)
#@ end

#@ def blog_generation():
- name: blog-generation
  image: tiddlywiki
  command: ["/bin/sh"]
  args:
    - -c
    - |
      set -ex
      mkdir -p /data/logs /data/stats /data/db
      rm -rvf /data/blog
      tiddlywiki "/tiddlywiki"  --output /data/blog --commands "[enlist:raw{$:/plugins/litapp/blog/build}]"

  volumeMounts:
  - name: volv
    mountPath: /tiddlywiki
  - name: blog-data
    mountPath: /data
#@ end

#@ def volumes():
- name: volv
  persistentVolumeClaim:
    claimName: mywiki-pvc
- name: blog-data
  persistentVolumeClaim:
    claimName: blog-pvc
- name: config
  configMap:
    defaultMode: 420
    name: caddy
    items:
    - key: "Caddyfile"
      path: "Caddyfile"
#@ end

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  name: blog
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
      - image: caddy
        name: blog
        ports:
          - containerPort: 80
            name: http-blog
        volumeMounts:
        - name: blog-data
          mountPath: /data
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
      initContainers: #@ blog_generation()
      volumes: #@ volumes()

---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  name: blog
  namespace: default
spec:
  ports:
    - name: http-blog
      port: 8090
      targetPort: http-blog
  selector:
    app: blog

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-blog
spec:
  schedule: "*/23 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers: #@ blog_generation()
          restartPolicy: Never
          volumes: #@ volumes()
      backoffLimit: 4
      ttlSecondsAfterFinished: #@ 24*60*60
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: generate-stats
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: goaccess
            image: allinurl/goaccess
            command: ["/bin/sh"]
            args:
              - -c
              - |
                if [ -f /data/logs/access.log ]; then
                  goaccess /data/logs/access.log \
                    --log-format=CADDY \
                    --output=/data/stats/index.html \
                    --persist \
                    --restore \
                    --db-path=/data/db \
                    --no-global-config
                else
                  echo "No log file found at /data/logs/access.log"
                fi
            volumeMounts:
            - name: blog-data
              mountPath: /data
          restartPolicy: OnFailure
          volumes: #@ volumes()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
data:
  Caddyfile: #@ caddyfile()
